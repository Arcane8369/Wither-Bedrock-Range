name: Build All (1.21 & 1.20)

# Builds BOTH the NeoForge 1.21.1 project (this branch / `main`) and the
# Forge 1.20.1 port (checked out from the `port/1.20.1-forge` branch) in one
# manual run, uploading both jars as artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1211:
    name: Build NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build with Gradle
        run: chmod u+x ./gradlew && ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'witherbedrockrange-1.21.1-neoforge'
          path: build/libs/*.jar
          retention-days: 7
          compression-level: 9

  build-1201:
    name: Build Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forge 1.20.1 port branch
        uses: actions/checkout@v7.0.0
        with:
          ref: 'port/1.20.1-forge'
          path: forge-port

      - name: Setup JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build with Gradle
        working-directory: forge-port
        run: chmod u+x ./gradlew && ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'witherbedrockrange-1.20.1-forge'
          path: forge-port/build/libs/*.jar
          retention-days: 7
          compression-level: 9