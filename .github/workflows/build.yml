name: Build

# Branch-aware build. When run on:
#   - main              -> builds NeoForge 1.21.1 (Java 21)
#   - port/1.20.1-forge -> builds Forge 1.20.1 (Java 17)
# For manual runs, pick the branch in the "Use workflow from" dropdown; the matching
# job is selected by github.ref_name. On push, each branch builds itself.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-1211:
    name: Build NeoForge 1.21.1
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build with Gradle
        run: chmod u+x ./gradlew && ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'witherbedrockrange-1.21.1-neoforge'
          path: build/libs/*.jar
          retention-days: 7
          compression-level: 9

  build-1201:
    name: Build Forge 1.20.1
    if: github.ref_name == 'port/1.20.1-forge'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup JDK 17
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build with Gradle
        run: chmod u+x ./gradlew && ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 'witherbedrockrange-1.20.1-forge'
          path: build/libs/*.jar
          retention-days: 7
          compression-level: 9