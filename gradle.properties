org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
# Use the default local JVM toolchain (Java 21). Machine-specific settings such
# as a local HTTP proxy or a custom JDK install path belong in
# ~/.gradle/gradle.properties, NOT here, so they are not committed to the repo.
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.kotlin.dsl.allWarningsAsErrors=true
